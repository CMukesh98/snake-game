<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neo Tic-Tac-Toe | Cyberpunk Glow Strategy Game</title>
    <meta name="description" content="Play Neo Tic-Tac-Toe: a stunning cyberpunk glow game with unbeatable Minimax AI, 3x3, 4x4, and 5x5 boards, match replays, sound effects, and themes.">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Background Visuals -->
    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>
    <div class="grid-mesh-bg"></div>

    <!-- Celebration Canvas -->
    <canvas id="confetti-canvas"></canvas>

    <div class="app-container">
        <!-- Header -->
        <header class="game-header">
            <div class="brand-wrapper">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                        <line x1="4" y1="4" x2="20" y2="20"/>
                        <line x1="20" y1="4" x2="4" y2="20"/>
                    </svg>
                </div>
                <h1 class="brand-title">NEO TIC-TAC-TOE</h1>
            </div>

            <div class="header-actions">
                <button id="btn-sound" class="btn-icon" title="Toggle Sound (M)" aria-label="Toggle Sound">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                    </svg>
                </button>
                <button id="btn-theme" class="btn-icon" title="Themes" aria-label="Themes">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5"/>
                        <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                    </svg>
                </button>
                <button id="btn-reset-stats" class="btn-icon" title="Reset Scores" aria-label="Reset Scores">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Segmented Controls -->
        <div class="config-bar">
            <!-- Mode Switcher -->
            <div class="segmented-control" id="mode-control" role="group" aria-label="Game Mode">
                <button class="segmented-btn active" data-mode="ai" id="mode-ai">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="10" rx="2"/>
                        <circle cx="12" cy="5" r="2"/>
                        <path d="M12 7v4"/>
                        <line x1="8" y1="16" x2="8" y2="16"/>
                        <line x1="16" y1="16" x2="16" y2="16"/>
                    </svg>
                    vs Bot
                </button>
                <button class="segmented-btn" data-mode="pvp" id="mode-pvp">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                    </svg>
                    2 Players
                </button>
            </div>

            <!-- Difficulty Switcher (Visible in AI mode) -->
            <div class="segmented-control" id="diff-control" role="group" aria-label="Difficulty">
                <button class="segmented-btn" data-diff="easy" id="diff-easy">Casual</button>
                <button class="segmented-btn" data-diff="medium" id="diff-medium">Tactical</button>
                <button class="segmented-btn active" data-diff="impossible" id="diff-god">Unbeatable</button>
            </div>

            <!-- Grid Size Switcher -->
            <div class="segmented-control" id="size-control" role="group" aria-label="Grid Size">
                <button class="segmented-btn active" data-size="3" id="size-3">3x3</button>
                <button class="segmented-btn" data-size="4" id="size-4">4x4</button>
                <button class="segmented-btn" data-size="5" id="size-5">5x5</button>
            </div>
        </div>

        <!-- Scoreboard -->
        <section class="scoreboard" aria-label="Scoreboard">
            <div class="player-card player-x">
                <div class="player-avatar" id="avatar-x">X</div>
                <div class="player-info">
                    <span class="player-name" id="player-x-name">Player X</span>
                    <span class="player-score" id="score-x">0</span>
                </div>
            </div>

            <div class="vs-divider">
                <span class="vs-badge">VS</span>
                <span class="ties-count" id="score-ties">0 Ties</span>
            </div>

            <div class="player-card player-o">
                <div class="player-avatar" id="avatar-o">O</div>
                <div class="player-info">
                    <span class="player-name" id="player-o-name">CyberBot</span>
                    <span class="player-score" id="score-o">0</span>
                </div>
            </div>
        </section>

        <!-- Status & Turn Indicator Banner -->
        <section class="status-banner" aria-live="polite">
            <div class="status-left">
                <div class="turn-pulse-dot" id="turn-pulse-dot"></div>
                <span class="status-text" id="status-text">Your Turn (X)</span>
            </div>
            <div class="streak-tag" id="streak-tag" title="Win Streak">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2c-.5 2-2 3.5-3.5 5.5C7 9.5 6 12 6 14.5 6 18.5 9 22 13 22s7-3.5 7-7.5c0-4-3-7-4-9-1 2-2 3-3 3-.5-2-1-4-1-6.5z"/>
                </svg>
                <span id="streak-count">0 🔥</span>
            </div>
        </section>

        <!-- Game Board Arena -->
        <main class="board-wrapper">
            <svg id="strike-canvas" aria-hidden="true"></svg>
            <div class="board-grid size-3 turn-x" id="board-grid" role="grid" aria-label="Tic Tac Toe Board">
                <!-- Dynamically rendered cells -->
            </div>
        </main>

        <!-- Action Controls -->
        <div class="action-controls">
            <button class="btn-primary" id="btn-restart" title="New Game (R)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                    <polyline points="23 4 23 10 17 10"/>
                    <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
                </svg>
                New Game
            </button>

            <button class="btn-secondary" id="btn-undo" title="Undo Move (U)" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 7v6h6"/>
                    <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/>
                </svg>
                Undo
            </button>

            <button class="btn-secondary" id="btn-replay" title="Replay Match" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="5 3 19 12 5 21 5 3"/>
                </svg>
                Replay
            </button>
        </div>

        <!-- Shortcuts Pill / Helper Text -->
        <div style="font-size: 0.75rem; color: var(--text-muted); text-align: center; margin-top: 0.25rem;">
            Tip: Use Keyboard NumPad <strong>1–9</strong> to play &bull; <strong>R</strong> for New Game &bull; <strong>U</strong> for Undo
        </div>
    </div>

    <!-- Theme Customization Modal -->
    <div class="modal-overlay" id="theme-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-card">
            <div class="modal-header">
                <h2 class="modal-title" id="modal-title">Customize Theme</h2>
                <button class="modal-close" id="modal-close" aria-label="Close Modal">
                    <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>

            <div class="modal-section">
                <span class="modal-label">Choose Visual Style</span>
                <div class="theme-palette-grid">
                    <div class="theme-option active" data-theme-choice="cyber-neon">
                        <div class="color-dots">
                            <span class="color-dot" style="background: #00f2fe;"></span>
                            <span class="color-dot" style="background: #ff007f;"></span>
                        </div>
                        <span class="theme-name">Cyber Neon</span>
                    </div>

                    <div class="theme-option" data-theme-choice="emerald-matrix">
                        <div class="color-dots">
                            <span class="color-dot" style="background: #10b981;"></span>
                            <span class="color-dot" style="background: #f59e0b;"></span>
                        </div>
                        <span class="theme-name">Emerald Matrix</span>
                    </div>

                    <div class="theme-option" data-theme-choice="sunset-synth">
                        <div class="color-dots">
                            <span class="color-dot" style="background: #a855f7;"></span>
                            <span class="color-dot" style="background: #ff5e62;"></span>
                        </div>
                        <span class="theme-name">Sunset Synth</span>
                    </div>

                    <div class="theme-option" data-theme-choice="obsidian-luxury">
                        <div class="color-dots">
                            <span class="color-dot" style="background: #38bdf8;"></span>
                            <span class="color-dot" style="background: #f5d070;"></span>
                        </div>
                        <span class="theme-name">Obsidian Gold</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="audio.js"></script>
    <script src="confetti.js"></script>
    <script src="game.js"></script>
    <script src="app.js"></script>
</body>
</html>
